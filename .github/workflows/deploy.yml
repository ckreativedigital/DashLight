# Publishes DashLight to WordPress.org whenever a GitHub release is published.
#
# One-time setup, after WordPress.org approves the plugin:
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#     SVN_USERNAME  your WordPress.org username (ckreativedev)
#     SVN_PASSWORD  the SVN password from your WordPress.org profile (Account & Security)
#
# Each release:
#   1. Bump the version in dashlight.php (Version + DASHLIGHT_VERSION) and readme.txt (Stable tag),
#      and add a changelog entry. Commit and push.
#   2. On GitHub: Releases → Draft a new release → tag it with the same number, no "v" (e.g. 1.0.1) → Publish.
#
# Banners, icons, and screenshots go in the .wordpress-org folder and are uploaded with each release.

name: Deploy to WordPress.org

on:
  release:
    types: [released]

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Make sure the version numbers match the release tag
        run: |
          TAG="$GITHUB_REF_NAME"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' dashlight.php | awk '{print $NF}')
          CONSTANT=$(grep -m1 "define( 'DASHLIGHT_VERSION'" dashlight.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "Tag: $TAG | Version header: $HEADER | DASHLIGHT_VERSION: $CONSTANT | Stable tag: $STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONSTANT" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Version numbers don't match the release tag. Update dashlight.php and readme.txt, then publish the release again."
            exit 1
          fi

      - name: Deploy to WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: dashlight

      - name: Attach the zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
